[package]
name = "md-preview"
version = "1.4.0"
edition = "2021"

[features]
default = ["desktop"]
desktop = [
  "dep:image",
  "dep:notify",
  "dep:objc2",
  "dep:objc2-app-kit",
  "dep:objc2-foundation",
  "dep:open",
  "dep:rfd",
  "dep:sys-locale",
  "dep:tao",
  "dep:url",
  "dep:winreg",
  "dep:wry",
]
renderer = [
  "dep:cairo-rs",
  "dep:gio",
  "dep:glib",
  "dep:gtk",
  "dep:webkit2gtk",
]

[[bin]]
name = "md-preview"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "md-preview-render"
path = "src/bin/md-preview-render.rs"
required-features = ["renderer"]

[dependencies]
wry = { version = "0.50", optional = true }
tao = { version = "0.33", optional = true }
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
rfd = { version = "0.15", optional = true }
notify = { version = "7", optional = true }
open = { version = "5", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "ico"], optional = true }
sys-locale = { version = "0.3", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = { version = "2", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
cairo-rs = { version = "0.18", features = ["png"], optional = true }
gio = { version = "0.18", optional = true }
glib = { version = "0.18", optional = true }
gtk = { version = "0.18", optional = true }
webkit2gtk = { version = "2.0", features = ["v2_32"], optional = true }

[target.'cfg(windows)'.dependencies]
winreg = { version = "0.52", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.4", optional = true }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSAlert", "NSApplication", "NSButton", "NSCell", "NSControl", "NSEvent", "NSImage", "NSMenu", "NSMenuItem", "NSResponder", "NSView"], optional = true }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["objc2-core-foundation", "NSString"], optional = true }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
